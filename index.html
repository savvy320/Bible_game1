<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>말씀 채우기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; }
  #vg-app {
    min-height: 100vh;
    background: #1B1512;
    color: #EDE0C8;
    font-family: 'Noto Sans KR', sans-serif;
    display: flex;
    flex-direction: column;
  }
  .vg-serif { font-family: 'Noto Serif KR', serif; }
  .vg-scroll::-webkit-scrollbar { width: 6px; }
  .vg-scroll::-webkit-scrollbar-thumb { background: rgba(237,224,200,0.2); border-radius: 3px; }
  @keyframes vg-glow {
    0% { box-shadow: 0 0 0 rgba(201,162,39,0); transform: scale(0.9); }
    40% { box-shadow: 0 0 16px rgba(201,162,39,0.6); transform: scale(1.05); }
    100% { box-shadow: 0 0 0 rgba(201,162,39,0); transform: scale(1); }
  }
  .vg-fill { animation: vg-glow 0.7s ease-out; }
  @keyframes vg-fade {
    0% { opacity: 0; transform: translateY(6px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .vg-toast { animation: vg-fade 0.25s ease-out; }
  #vg-app input:focus { outline: none; }
  #vg-app button { font-family: inherit; }
  #vg-app button:disabled { opacity: 0.5; cursor: default; }

  .vg-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .vg-card { width: 100%; max-width: 380px; background: #241C17; border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
  .vg-badge { margin: 0 auto 14px; width: fit-content; padding: 8px 20px; border: 2px solid #C9A227; border-radius: 999px; background: rgba(201,162,39,0.08); }
  .vg-badge-text { font-size: 20px; font-weight: 700; color: #C9A227; }
  .vg-sub { text-align: center; font-size: 13px; opacity: 0.75; margin-bottom: 22px; line-height: 1.5; }
  .vg-label { font-size: 12px; opacity: 0.7; margin-bottom: 6px; display: block; }
  .vg-input-field {
    width: 100%; background: #1B1512; border: 1px solid rgba(237,224,200,0.2); border-radius: 10px;
    padding: 12px 14px; color: #EDE0C8; font-size: 16px; margin-bottom: 16px;
  }
  .vg-error-text { color: #E08A6E; font-size: 13px; margin-bottom: 12px; }
  .vg-primary-btn {
    width: 100%; background: #C9A227; color: #1B1512; border: none; border-radius: 12px;
    padding: 14px 0; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .vg-rule-box { margin-top: 20px; padding: 14px; background: rgba(237,224,200,0.06); border-radius: 12px; }
  .vg-player-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .vg-player-chip { display: flex; align-items: center; gap: 4px; border: 1px solid; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
  .vg-rule-title { font-size: 12px; font-weight: 700; margin-bottom: 4px; color: #C9A227; }
  .vg-rule-text { font-size: 12.5px; line-height: 1.6; opacity: 0.85; }

  .vg-game-wrap { flex: 1; display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; width: 100%; }
  .vg-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 8px; }
  .vg-header-label { font-size: 10px; opacity: 0.6; margin-bottom: 2px; }
  .vg-room-code-btn { background: none; border: none; color: #C9A227; font-size: 18px; font-weight: 700; letter-spacing: 2px; padding: 0; cursor: pointer; }
  .vg-leave-btn { background: rgba(237,224,200,0.08); border: 1px solid rgba(237,224,200,0.15); color: #EDE0C8; border-radius: 10px; padding: 8px 12px; font-size: 12.5px; cursor: pointer; }
  .vg-nuke-btn { background: rgba(232,138,130,0.12); border: 1px solid #E08A6E; color: #E08A6E; border-radius: 10px; padding: 8px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .vg-score-row { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 10px; }
  .vg-score-empty { font-size: 12.5px; opacity: 0.6; }
  .vg-score-chip { display: flex; align-items: center; gap: 6px; background: rgba(237,224,200,0.06); border: 1px solid; border-radius: 999px; padding: 6px 10px; font-size: 12.5px; flex-shrink: 0; white-space: nowrap; }
  .vg-score-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .vg-score-count { opacity: 0.7; }

  .vg-turn-banner { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 2px 16px 10px; font-size: 13.5px; }
  .vg-turn-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .vg-turn-text { opacity: 0.85; }
  .vg-turn-text-mine { color: #C9A227; font-weight: 700; }
  .vg-timer { margin-left: 8px; background: rgba(201,162,39,0.15); border: 1px solid #C9A227; color: #C9A227; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .vg-verse-area { flex: 1; overflow-y: auto; padding: 8px 20px 16px; }
  .vg-ref-badge { text-align: center; font-size: 13px; color: #C9A227; font-weight: 700; margin-bottom: 18px; letter-spacing: 1px; }
  .vg-verse-line { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: flex-end; }
  .vg-blank-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .vg-hint-above { font-size: 12px; color: #C9A227; font-weight: 700; letter-spacing: 2px; }
  .vg-hint-above-empty { height: 15px; }
  .vg-word-tile { background: #EDE0C8; color: #3A2C1D; padding: 8px 12px; border-radius: 6px; font-size: 17px; font-weight: 500; box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .vg-blank-tile { display: inline-flex; align-items: center; justify-content: center; padding: 8px 12px; border-radius: 6px; font-size: 17px; color: rgba(201,162,39,0.6); border: 1.5px dashed rgba(201,162,39,0.45); background: rgba(201,162,39,0.05); letter-spacing: 2px; }
  .vg-remaining-text { text-align: center; font-size: 12.5px; opacity: 0.6; margin-top: 22px; }
  .vg-complete-box { text-align: center; margin-top: 26px; }
  .vg-complete-title { font-size: 16px; font-weight: 700; color: #C9A227; margin-bottom: 12px; }
  .vg-next-btn { background: #C9A227; color: #1B1512; border: none; border-radius: 12px; padding: 12px 24px; font-size: 15px; font-weight: 700; cursor: pointer; }

  .vg-flash-toast { position: absolute; bottom: 78px; left: 50%; transform: translateX(-50%); background: #4E8C7A; color: #1B1512; padding: 6px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
  .vg-error-toast { padding: 0 16px 8px; color: #E08A6E; font-size: 12.5px; text-align: center; }
  .vg-input-bar { display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(237,224,200,0.1); background: #241C17; }
  .vg-game-input { flex: 1; background: #1B1512; border: 1px solid rgba(237,224,200,0.2); border-radius: 12px; padding: 12px 14px; color: #EDE0C8; font-size: 16px; }
  .vg-hint-btn { background: rgba(201,162,39,0.12); color: #C9A227; border: 1px solid #C9A227; border-radius: 12px; padding: 0 14px; font-size: 13.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .vg-submit-btn { background: #C9A227; color: #1B1512; border: none; border-radius: 12px; padding: 0 20px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .vg-submit-btn:disabled, .vg-game-input:disabled, .vg-hint-btn:disabled { opacity: 0.5; }
</style>
</head>
<body>
<div id="vg-app"></div>

<script>
(function () {
  const PALETTE = ["#C9A227", "#8B3A3A", "#3E6B5C", "#5B6FA6", "#946A9E", "#A96A3B", "#4E8C7A"];
  const colorForIndex = (i) => PALETTE[i % PALETTE.length];

  const VERSES = [
    { ref: "창세기 1:1", text: "태초에 하나님이 천지를 창조하시니라" },
    { ref: "시편 23:1", text: "여호와는 나의 목자시니 내게 부족함이 없으리로다" },
    { ref: "시편 46:1", text: "하나님은 우리의 피난처시요 힘이시니 환난 중에 만날 큰 도움이시라" },
    { ref: "시편 118:24", text: "이 날은 여호와께서 정하신 것이라 이 날에 우리가 즐거워하고 기뻐하리로다" },
    { ref: "잠언 3:5", text: "너는 마음을 다하여 여호와를 신뢰하고 네 명철을 의지하지 말라" },
    { ref: "이사야 40:31", text: "오직 여호와를 앙망하는 자는 새 힘을 얻으리니 독수리가 날개치며 올라감 같을 것이요" },
    { ref: "요한복음 3:16", text: "하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라" },
    { ref: "마태복음 6:33", text: "너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라" },
    { ref: "로마서 8:28", text: "하나님을 사랑하는 자 곧 그의 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 선을 이루느니라" },
    { ref: "빌립보서 4:13", text: "내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라" },
    { ref: "빌립보서 4:6", text: "아무것도 염려하지 말고 다만 모든 일에 기도와 간구로 너희 구할 것을 감사함으로 하나님께 아뢰라" },
    { ref: "여호수아 1:9", text: "내가 네게 명령한 것이 아니냐 강하고 담대하라 두려워하지 말며 놀라지 말라" },
  ];

  function normalize(w) {
    return w.replace(/[.,!?;:"'“”‘’]+$/g, "").trim();
  }

  const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  function choseongOfChar(ch) {
    const code = ch.charCodeAt(0) - 0xac00;
    if (code < 0 || code > 11171) return ch;
    return CHO[Math.floor(code / (21 * 28))];
  }
  function choseongOfWord(w) {
    return w.split("").map(choseongOfChar).join(" ");
  }

  function buildRound(prevIndex) {
    let idx = Math.floor(Math.random() * VERSES.length);
    if (VERSES.length > 1) {
      while (idx === prevIndex) idx = Math.floor(Math.random() * VERSES.length);
    }
    const words = VERSES[idx].text.split(" ");
    const blankMask = words.map(() => true);
    return { verseIndex: idx, words, blankMask, completed: false, hintedIndex: null };
  }

  function emptyRoom() {
    const round = buildRound(-1);
    return { ...round, players: [], scores: {}, turnIndex: 0, started: false, host: null, leftPlayers: [] };
  }

  const state = {
    screen: "join",
    nickname: "",
    roomInput: "",
    roomCode: "",
    room: emptyRoom(),
    input: "",
    error: "",
    flash: "",
    flashPenalty: false,
    loading: false,
    copyOk: false,
    timeLeft: 10,
    timerInterval: null,
    lastTurnKey: null,
    heartbeatTimer: null,
  };

  const TURN_SECONDS = 20;
  const HEARTBEAT_MS = 8000;
  const STALE_MS = 40000;

  let pollTimer = null;

  // --- 서버 API (Netlify Function + Netlify Blobs) ---
  async function fetchRoom() {
    if (!state.roomCode) return null;
    try {
      const res = await fetch(`/.netlify/functions/room?code=${encodeURIComponent(state.roomCode)}`);
      if (!res.ok) return null;
      const data = await res.json();
      return data.value || null;
    } catch (e) {
      return null;
    }
  }

  async function writeRoom(next) {
    if (!state.roomCode) return { ok: false, reason: "no room" };
    try {
      const res = await fetch(`/.netlify/functions/room?code=${encodeURIComponent(state.roomCode)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(next),
      });
      if (!res.ok) return { ok: false, reason: `HTTP ${res.status}` };
      return { ok: true, reason: "" };
    } catch (e) {
      return { ok: false, reason: (e && e.message) || "network error" };
    }
  }

  async function deleteRoom() {
    if (!state.roomCode) return;
    try {
      await fetch(`/.netlify/functions/room?code=${encodeURIComponent(state.roomCode)}`, {
        method: "DELETE",
      });
    } catch (e) {
      // 삭제 실패해도 나가기 자체는 진행
    }
  }

  function startPolling() {
    stopPolling();
    const poll = async () => {
      const data = await fetchRoom();
      if (data) {
        state.room = data;
        if (state.screen === "lobby" && data.started) {
          state.screen = "game";
        }

        // 워치독: 내 차례가 아닌데 현재 차례가 제한시간을 넘겼으면, 대신 다음 차례로 넘겨준다.
        // (차례인 사람이 갑자기 사라져도 게임이 멈추지 않도록)
        if (state.screen === "game" && !data.completed) {
          const { player: tp } = resolveTurn(data);
          const isMine = tp && tp.name === state.nickname.trim();
          if (!isMine && tp && data.turnStartedAt && Date.now() - data.turnStartedAt > TURN_SECONDS * 1000) {
            forceAdvanceStaleTurn();
          }
        }

        const active = document.activeElement;
        const typing = active && active.id === "vg-guess-input";
        if (!typing) render();
      }
    };
    poll();
    pollTimer = setInterval(poll, 2000);
  }
  function stopPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = null;
  }

  async function sendHeartbeat() {
    const name = state.nickname.trim();
    if (!state.roomCode || !name) return;
    const fresh = await fetchRoom();
    if (!fresh) return;
    const lastSeen = { ...(fresh.lastSeen || {}), [name]: Date.now() };
    await writeRoom({ ...fresh, lastSeen });
  }

  function startHeartbeat() {
    stopHeartbeat();
    sendHeartbeat();
    state.heartbeatTimer = setInterval(sendHeartbeat, HEARTBEAT_MS);
  }

  function stopHeartbeat() {
    if (state.heartbeatTimer) clearInterval(state.heartbeatTimer);
    state.heartbeatTimer = null;
  }

  // 탭을 닫거나 새로고침/다른 페이지로 이동할 때, 가능한 경우 즉시 "나감" 신호를 보낸다.
  window.addEventListener("pagehide", () => {
    const name = state.nickname.trim();
    if (!state.roomCode || !name) return;
    if (state.screen !== "lobby" && state.screen !== "game") return;
    try {
      const payload = JSON.stringify({ __action: "leave", name });
      const blob = new Blob([payload], { type: "application/json" });
      navigator.sendBeacon(`/.netlify/functions/room?code=${encodeURIComponent(state.roomCode)}`, blob);
    } catch (e) {
      // 지원 안 하는 브라우저면 하트비트 끊김으로 결국 감지됨
    }
  });

  async function claimHost(name) {
    try {
      const res = await fetch(`/.netlify/functions/room?code=${encodeURIComponent(state.roomCode)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ __action: "claim-host", name }),
      });
      if (!res.ok) return null;
      const data = await res.json();
      return data.host || null;
    } catch (e) {
      return null;
    }
  }

  async function handleStart() {
    const name = state.nickname.trim();
    if (!name) {
      state.error = "닉네임을 입력해 주세요.";
      render();
      return;
    }
    state.loading = true;
    state.error = "";
    render();

    const code = state.roomInput.trim().toUpperCase() || Math.random().toString(36).slice(2, 6).toUpperCase();
    state.roomCode = code;

    let existing = await fetchRoom();
    const data = existing || emptyRoom();
    let players = data.players || [];
    if (!players.find((p) => p.name === name)) {
      players = [...players, { name, color: colorForIndex(players.length) }];
    }
    const leftPlayers = (data.leftPlayers || []).filter((n) => n !== name);
    const lastSeen = { ...(data.lastSeen || {}), [name]: Date.now() };
    const next = { ...data, players, leftPlayers, lastSeen };

    const { ok, reason } = await writeRoom(next);
    if (!ok) {
      state.loading = false;
      state.roomCode = "";
      state.error = `방을 만들지 못했어요. (${reason})`;
      render();
      return;
    }

    // 방장은 서버에서 "아직 없을 때만" 지정하는 원자적 요청으로 확정 (동시 참가 경쟁 상태 방지)
    const resolvedHost = await claimHost(name);
    next.host = resolvedHost || next.host || name;

    state.loading = false;
    state.room = next;
    state.screen = next.started ? "game" : "lobby";
    render();
    startPolling();
    startHeartbeat();
  }

  async function handleStartGame() {
    state.loading = true;
    render();
    const fresh = (await fetchRoom()) || state.room;
    const next = { ...fresh, started: true, turnStartedAt: Date.now() };
    const { ok } = await writeRoom(next);
    state.loading = false;
    if (ok) {
      state.room = next;
      state.screen = "game";
    }
    render();
  }

  function currentTurnPlayer(room) {
    return resolveTurn(room).player;
  }

  // 명시적으로 나갔거나(leftPlayers), 하트비트가 끊긴 지 STALE_MS 이상 지난 사람은 비활성으로 본다.
  function isPlayerActive(room, name) {
    const leftPlayers = room.leftPlayers || [];
    if (leftPlayers.includes(name)) return false;
    const lastSeen = (room.lastSeen || {})[name];
    if (!lastSeen) return true; // 아직 하트비트 기록 전(막 참가) → 우선 활성으로 간주
    return Date.now() - lastSeen < STALE_MS;
  }

  // 비활성 참가자를 건너뛰고 실제 차례인 사람과 그 인덱스를 찾는다.
  function resolveTurn(room) {
    const players = room.players || [];
    if (players.length === 0) return { player: null, index: 0 };
    const activeExists = players.some((p) => isPlayerActive(room, p.name));
    if (!activeExists) return { player: null, index: 0 };
    let idx = (room.turnIndex || 0) % players.length;
    let guard = 0;
    while (!isPlayerActive(room, players[idx].name) && guard < players.length) {
      idx = (idx + 1) % players.length;
      guard++;
    }
    return { player: players[idx], index: idx };
  }

  function activePlayers(room) {
    return (room.players || []).filter((p) => isPlayerActive(room, p.name));
  }

  function stopTurnTimer() {
    if (state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = null;
    state.lastTurnKey = null;
  }

  function manageTurnTimer(room, isMyTurn) {
    if (!isMyTurn || room.completed) {
      stopTurnTimer();
      return;
    }
    const key = `${room.verseIndex}:${room.turnIndex}:${(room.blankMask || []).filter(Boolean).length}`;
    if (key === state.lastTurnKey) return; // 이미 진행 중인 같은 차례
    if (state.timerInterval) clearInterval(state.timerInterval);
    state.lastTurnKey = key;
    state.timeLeft = TURN_SECONDS;
    state.timerInterval = setInterval(tickTurnTimer, 1000);
    stampMyTurnStart(); // 건너뛰기로 내 차례가 된 경우 등, 서버의 시작 시각을 지금으로 맞춘다
  }

  async function stampMyTurnStart() {
    const fresh = await fetchRoom();
    if (!fresh || fresh.completed) return;
    const { player: tp } = resolveTurn(fresh);
    if (!tp || tp.name !== state.nickname.trim()) return; // 그 사이 상황이 바뀌었으면 건너뜀
    await writeRoom({ ...fresh, turnStartedAt: Date.now() });
  }

  function tickTurnTimer() {
    state.timeLeft -= 1;
    const el = document.getElementById("vg-timer");
    if (el) el.textContent = `⏱ ${state.timeLeft}초`;
    if (state.timeLeft <= 0) {
      clearInterval(state.timerInterval);
      state.timerInterval = null;
      state.lastTurnKey = null;
      handleTimeout();
    }
  }

  async function handleTimeout() {
    const fresh = (await fetchRoom()) || state.room;
    const { player: turnPlayer, index: turnIdx } = resolveTurn(fresh);
    if (!turnPlayer || turnPlayer.name !== state.nickname.trim() || fresh.completed) {
      return; // 이미 다른 사람이 처리했거나 차례가 넘어감
    }
    const players = fresh.players || [];
    const nextTurnIndex = players.length > 0 ? (turnIdx + 1) % players.length : 0;
    const next = { ...fresh, turnIndex: nextTurnIndex, hintedIndex: null, turnStartedAt: Date.now() };
    const { ok } = await writeRoom(next);
    if (ok) state.room = next;
    state.error = "시간이 초과되어 다음 사람 차례로 넘어가요.";
    state.input = "";
    render();
  }

  // 다른 참가자가(내 차례가 아닌데도) 현재 차례의 제한시간 초과를 대신 처리한다.
  // 차례인 사람이 응답 없이 사라졌을 때 게임이 멈추지 않도록 하기 위함.
  async function forceAdvanceStaleTurn() {
    const fresh = await fetchRoom();
    if (!fresh || fresh.completed) return;
    if (!fresh.turnStartedAt || Date.now() - fresh.turnStartedAt < TURN_SECONDS * 1000) return; // 이미 처리됨
    const { player: turnPlayer, index: turnIdx } = resolveTurn(fresh);
    if (!turnPlayer) return;
    const players = fresh.players || [];
    const nextTurnIndex = players.length > 0 ? (turnIdx + 1) % players.length : 0;
    const next = { ...fresh, turnIndex: nextTurnIndex, hintedIndex: null, turnStartedAt: Date.now() };
    await writeRoom(next);
  }

  async function handleHint() {
    const fresh = (await fetchRoom()) || state.room;
    const turnPlayer = currentTurnPlayer(fresh);
    if (!turnPlayer || turnPlayer.name !== state.nickname.trim()) {
      state.error = `지금은 ${turnPlayer ? turnPlayer.name : "다른 사람"}님 차례예요.`;
      render();
      return;
    }
    const blankIndices = fresh.blankMask.reduce((acc, isBlank, i) => {
      if (isBlank) acc.push(i);
      return acc;
    }, []);
    if (blankIndices.length === 0) return;
    const idx = blankIndices[Math.floor(Math.random() * blankIndices.length)];

    const next = { ...fresh, hintedIndex: idx };
    const { ok } = await writeRoom(next);
    if (ok) {
      state.room = next;
      render();
    }
  }

  async function handleGuess(e) {
    e.preventDefault();
    const guess = normalize(state.input.trim());
    if (!guess) return;
    state.error = "";
    state.loading = true;
    render();

    const fresh = (await fetchRoom()) || state.room;
    const players = fresh.players || [];
    const { player: turnPlayer, index: turnIdx } = resolveTurn(fresh);

    if (turnPlayer && turnPlayer.name !== state.nickname.trim()) {
      state.loading = false;
      state.error = `지금은 ${turnPlayer.name}님 차례예요.`;
      render();
      return;
    }

    const idx = fresh.words.findIndex((w, i) => fresh.blankMask[i] && normalize(w) === guess);
    const nextTurnIndex = players.length > 0 ? (turnIdx + 1) % players.length : 0;

    if (idx === -1) {
      const next = { ...fresh, turnIndex: nextTurnIndex, turnStartedAt: Date.now() };
      const { ok } = await writeRoom(next);
      state.loading = false;
      if (ok) state.room = next;
      state.error = "정답이 아니에요. 다음 사람 차례로 넘어가요.";
      state.input = "";
      render();
      return;
    }

    const blankMask = [...fresh.blankMask];
    blankMask[idx] = false;
    const usedHint = fresh.hintedIndex === idx;
    const basePoints = normalize(fresh.words[idx]).length || 1;
    const points = usedHint ? Math.max(basePoints - 1, 0) : basePoints;
    const scores = { ...(fresh.scores || {}) };
    scores[state.nickname.trim()] = (scores[state.nickname.trim()] || 0) + points;
    const completed = !blankMask.some(Boolean);

    const next = { ...fresh, players, scores, blankMask, completed, turnIndex: nextTurnIndex, hintedIndex: null, turnStartedAt: Date.now() };
    const { ok, reason } = await writeRoom(next);
    state.loading = false;
    if (!ok) {
      state.error = `전송에 실패했어요. (${reason})`;
      render();
      return;
    }
    state.room = next;
    state.input = "";
    state.flash = fresh.words[idx];
    state.flashPenalty = usedHint;
    render();
    setTimeout(() => {
      state.flash = "";
      state.flashPenalty = false;
      render();
    }, 1200);
  }

  async function handleNextVerse() {
    state.loading = true;
    render();
    const fresh = (await fetchRoom()) || state.room;
    const round = buildRound(fresh.verseIndex);
    const next = {
      ...round,
      players: fresh.players || [],
      scores: fresh.scores || {},
      leftPlayers: fresh.leftPlayers || [],
      lastSeen: fresh.lastSeen || {},
      host: fresh.host || null,
      started: true,
      turnIndex: 0,
      turnStartedAt: Date.now(),
    };
    const { ok } = await writeRoom(next);
    state.loading = false;
    if (ok) state.room = next;
    render();
  }

  async function handleLeave() {
    stopPolling();
    stopTurnTimer();
    stopHeartbeat();

    const name = state.nickname.trim();
    const code = state.roomCode;
    if (code && name) {
      const fresh = (await fetchRoom()) || state.room;
      const players = fresh.players || [];
      const leftPlayers = Array.from(new Set([...(fresh.leftPlayers || []), name]));
      const allLeft = players.length > 0 && players.every((p) => leftPlayers.includes(p.name));
      if (allLeft) {
        await deleteRoom();
      } else {
        await writeRoom({ ...fresh, leftPlayers });
      }
    }

    state.screen = "join";
    state.roomCode = "";
    state.room = emptyRoom();
    state.roomInput = "";
    state.input = "";
    state.error = "";
    render();
  }

  async function handleNuke() {
    if (!window.confirm("정말 이 방을 폭파할까요? 모든 참가자가 더 이상 이 방에 들어올 수 없게 돼요.")) {
      return;
    }
    stopPolling();
    stopTurnTimer();
    stopHeartbeat();
    await deleteRoom();
    state.screen = "join";
    state.roomCode = "";
    state.room = emptyRoom();
    state.roomInput = "";
    state.input = "";
    state.error = "";
    render();
  }

  function hostControlHtml(room) {
    const isHost = !!room.host && room.host === state.nickname.trim();
    return isHost
      ? `<button id="vg-nuke-btn" class="vg-nuke-btn">방폭파</button>`
      : `<button id="vg-leave-btn" class="vg-leave-btn">나가기</button>`;
  }

  async function handleCopy() {
    try {
      await navigator.clipboard.writeText(state.roomCode);
      state.copyOk = true;
      render();
      setTimeout(() => {
        state.copyOk = false;
        render();
      }, 1200);
    } catch (e) {}
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function renderJoin() {
    return `
      <div class="vg-wrap">
        <div class="vg-card">
          <div class="vg-badge"><span class="vg-serif vg-badge-text">말씀 채우기</span></div>
          <p class="vg-sub">각자 폰이나 컴퓨터에서 같은 방 코드로 들어와 함께 빈칸을 채워요.</p>

          <label class="vg-label">닉네임</label>
          <input id="vg-nickname" class="vg-input-field" maxlength="10" placeholder="예: 은혜" value="${esc(state.nickname)}" />

          <label class="vg-label">방 코드 (있으면 입력, 없으면 새로 만들어요)</label>
          <input id="vg-roomcode" class="vg-input-field" style="text-transform:uppercase;letter-spacing:2px;" maxlength="4" placeholder="예: A1B2" value="${esc(state.roomInput)}" />

          ${state.error ? `<div class="vg-error-text">${esc(state.error)}</div>` : ""}

          <button id="vg-start-btn" class="vg-primary-btn" ${state.loading ? "disabled" : ""}>
            ${state.loading ? "준비 중..." : state.roomInput ? "참가하기" : "새 방 만들기"}
          </button>

          <div class="vg-rule-box">
            <div class="vg-rule-title">방법</div>
            <div class="vg-rule-text">장·절만 보여주고 본문은 모두 가려져요. 참가한 순서대로 차례가 돌아가며, 자기 차례에 빈칸에 들어갈 단어를 입력해요. 맞히면 글자 수만큼 점수를 얻고, 맞히든 틀리든 다음 사람 차례로 넘어가요.</div>
            <div class="vg-rule-title" style="margin-top:10px;">힌트 페널티</div>
            <div class="vg-rule-text">힌트(초성) 버튼을 사용한 뒤 정답을 맞히면 획득 점수에서 <strong>1점이 차감</strong>돼요. 힌트는 남은 빈칸 중 무작위 위치에 대해 보여줘요.</div>
          </div>
        </div>
      </div>
    `;
  }

  function renderLobby() {
    const room = state.room;
    const activeList = activePlayers(room);
    const isHost = !!room.host && room.host === state.nickname.trim();

    const chipsHtml = activeList.length === 0
      ? `<span style="opacity:0.5;font-size:12.5px;">아직 참가자가 없어요</span>`
      : activeList.map((p) => `
          <span class="vg-player-chip" style="border-color:${p.color}; color:${p.color}">
            ${p.name === room.host ? "👑 " : ""}${esc(p.name)}
          </span>
        `).join("");

    return `
      <div class="vg-game-wrap">
        <div class="vg-header">
          <div>
            <div class="vg-header-label">방 코드</div>
            <button id="vg-copy-btn" class="vg-room-code-btn">${esc(state.roomCode)} ${state.copyOk ? "· 복사됨" : "· 탭해서 복사"}</button>
          </div>
          ${hostControlHtml(room)}
        </div>

        <div class="vg-wrap" style="padding-top:0;">
          <div class="vg-card" style="box-shadow:none;">
            <div class="vg-badge"><span class="vg-serif vg-badge-text">참가자 대기 중</span></div>
            <div class="vg-player-chips" style="justify-content:center; margin-top:16px;">${chipsHtml}</div>
            ${state.error ? `<div class="vg-error-text" style="text-align:center; margin-top:14px;">${esc(state.error)}</div>` : ""}
            ${isHost
              ? `<button id="vg-startgame-btn" class="vg-primary-btn" style="margin-top:22px;" ${state.loading ? "disabled" : ""}>${state.loading ? "시작하는 중..." : "게임 시작"}</button>
                 <p class="vg-sub" style="margin-top:14px; margin-bottom:0;">참가자들이 다 모이면 시작 버튼을 눌러주세요.</p>`
              : `<p class="vg-sub" style="margin-top:22px; margin-bottom:0;">방장이 게임을 시작하길 기다리는 중이에요...</p>`}
          </div>
        </div>
      </div>
    `;
  }

  function renderGame() {
    const room = state.room;
    const players = room.players || [];
    const scoreMap = room.scores || {};
    const scores = players
      .filter((p) => isPlayerActive(room, p.name))
      .map((p) => [p.name, scoreMap[p.name] || 0])
      .sort((a, b) => b[1] - a[1]);
    const playerColor = (name) => (players.find((p) => p.name === name) || {}).color || "#C9A227";
    const remaining = (room.blankMask || []).filter(Boolean).length;
    const turnPlayer = currentTurnPlayer(room);
    const isMyTurn = !!(turnPlayer && turnPlayer.name === state.nickname.trim());

    manageTurnTimer(room, isMyTurn);

    const scoreRowHtml = scores.length === 0
      ? `<span class="vg-score-empty">아직 참가자가 없어요</span>`
      : scores.map(([name, count]) => `
          <div class="vg-score-chip" style="border-color:${playerColor(name)}">
            <span class="vg-score-dot" style="background:${playerColor(name)}"></span>
            <span style="font-weight:${name === state.nickname.trim() ? 700 : 500}">${esc(name)}</span>
            <span class="vg-score-count">${count}</span>
          </div>
        `).join("");

    const turnHtml = turnPlayer
      ? `<span class="vg-turn-dot" style="background:${turnPlayer.color}"></span>` +
        (isMyTurn
          ? `<span class="vg-turn-text-mine">내 차례예요!</span><span id="vg-timer" class="vg-timer">⏱ ${state.timeLeft}초</span>`
          : `<span class="vg-turn-text">${esc(turnPlayer.name)}님 차례</span>`)
      : `<span class="vg-turn-text">참가자를 기다리는 중</span>`;

    const verseLineHtml = (room.words || []).map((w, i) => {
      const isBlank = room.blankMask && room.blankMask[i];
      if (isBlank) {
        const len = normalize(w).length || 1;
        const isHinted = room.hintedIndex === i;
        const hintLabel = isHinted
          ? `<div class="vg-hint-above vg-serif">${esc(choseongOfWord(normalize(w)))}</div>`
          : `<div class="vg-hint-above-empty"></div>`;
        return `<div class="vg-blank-wrap">${hintLabel}<span class="vg-serif vg-blank-tile" style="width:${22 * len + 16}px">${"·".repeat(len)}</span></div>`;
      }
      const justFilled = state.flash === w;
      return `<div class="vg-blank-wrap"><div class="vg-hint-above-empty"></div><span class="vg-serif vg-word-tile ${justFilled ? "vg-fill" : ""}">${esc(w)}</span></div>`;
    }).join("");

    return `
      <div class="vg-game-wrap">
        <div class="vg-header">
          <div>
            <div class="vg-header-label">방 코드</div>
            <button id="vg-copy-btn" class="vg-room-code-btn">${esc(state.roomCode)} ${state.copyOk ? "· 복사됨" : "· 탭해서 복사"}</button>
          </div>
          ${hostControlHtml(room)}
        </div>

        <div class="vg-score-row vg-scroll">${scoreRowHtml}</div>

        <div class="vg-turn-banner">${turnHtml}</div>

        <div class="vg-verse-area vg-scroll">
          <div class="vg-ref-badge vg-serif">${esc((VERSES[room.verseIndex] || {}).ref || "")}</div>
          <div class="vg-verse-line">${verseLineHtml}</div>

          ${room.completed
            ? `<div class="vg-complete-box">
                 <div class="vg-complete-title">✨ 말씀을 완성했어요!</div>
                 <button id="vg-next-btn" class="vg-next-btn" ${state.loading ? "disabled" : ""}>다음 말씀</button>
               </div>`
            : `<div class="vg-remaining-text">남은 빈칸 ${remaining}개</div>`}
        </div>

        ${state.flash ? `<div class="vg-toast vg-flash-toast">✔ "${esc(state.flash)}" 정답!${state.flashPenalty ? " (힌트 사용 -1점)" : ""}</div>` : ""}
        ${state.error ? `<div class="vg-error-toast">${esc(state.error)}</div>` : ""}

        ${!room.completed ? `
          <form id="vg-guess-form" class="vg-input-bar">
            <button id="vg-hint-btn" type="button" class="vg-hint-btn" ${(state.loading || !isMyTurn) ? "disabled" : ""}>힌트</button>
            <input id="vg-guess-input" class="vg-game-input" autocomplete="off"
              placeholder="${isMyTurn ? "빈칸에 들어갈 단어" : (turnPlayer ? esc(turnPlayer.name) + "님 차례를 기다려요" : "")}"
              value="${esc(state.input)}" ${isMyTurn ? "" : "disabled"} />
            <button id="vg-submit-btn" class="vg-submit-btn" type="submit" ${(state.loading || !isMyTurn) ? "disabled" : ""}>채우기</button>
          </form>
        ` : ""}
      </div>
    `;
  }

  function render() {
    const root = document.getElementById("vg-app");
    if (state.screen === "join") root.innerHTML = renderJoin();
    else if (state.screen === "lobby") root.innerHTML = renderLobby();
    else root.innerHTML = renderGame();
    attachHandlers();
  }

  function attachHandlers() {
    if (state.screen === "join") {
      const nick = document.getElementById("vg-nickname");
      const room = document.getElementById("vg-roomcode");
      const startBtn = document.getElementById("vg-start-btn");
      if (nick) nick.addEventListener("input", (e) => { state.nickname = e.target.value; });
      if (room) room.addEventListener("input", (e) => {
        state.roomInput = e.target.value.toUpperCase();
        e.target.value = state.roomInput;
        const btn = document.getElementById("vg-start-btn");
        if (btn && !state.loading) {
          btn.textContent = state.roomInput ? "참가하기" : "새 방 만들기";
        }
      });
      if (startBtn) startBtn.addEventListener("click", handleStart);
    } else if (state.screen === "lobby") {
      const copyBtn = document.getElementById("vg-copy-btn");
      const leaveBtn = document.getElementById("vg-leave-btn");
      const nukeBtn = document.getElementById("vg-nuke-btn");
      const startGameBtn = document.getElementById("vg-startgame-btn");
      if (copyBtn) copyBtn.addEventListener("click", handleCopy);
      if (leaveBtn) leaveBtn.addEventListener("click", handleLeave);
      if (nukeBtn) nukeBtn.addEventListener("click", handleNuke);
      if (startGameBtn) startGameBtn.addEventListener("click", handleStartGame);
    } else {
      const copyBtn = document.getElementById("vg-copy-btn");
      const leaveBtn = document.getElementById("vg-leave-btn");
      const nukeBtn = document.getElementById("vg-nuke-btn");
      const form = document.getElementById("vg-guess-form");
      const input = document.getElementById("vg-guess-input");
      const nextBtn = document.getElementById("vg-next-btn");
      const hintBtn = document.getElementById("vg-hint-btn");
      if (copyBtn) copyBtn.addEventListener("click", handleCopy);
      if (leaveBtn) leaveBtn.addEventListener("click", handleLeave);
      if (nukeBtn) nukeBtn.addEventListener("click", handleNuke);
      if (form) form.addEventListener("submit", handleGuess);
      if (input) input.addEventListener("input", (e) => { state.input = e.target.value; });
      if (nextBtn) nextBtn.addEventListener("click", handleNextVerse);
      if (hintBtn) hintBtn.addEventListener("click", handleHint);
    }
  }

  render();
})();
</script>
</body>
</html>
